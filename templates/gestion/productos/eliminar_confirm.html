{% extends 'base.html' %}

{% block title %}Eliminar producto | Arteconfi{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <div class="admin-card">
        <div class="admin-card-body text-center py-4">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
            <h4 class="fw-bold mt-3">¿Eliminar producto?</h4>
            <p class="text-secondary">
                Se eliminará <strong>{{ producto.nombre }}</strong> del inventario.
                Esta acción no se puede deshacer.
            </p>
            <form method="post" class="d-flex justify-content-center gap-2 mt-4">
                {% csrf_token %}
                <a href="{% url 'gestion:productos_lista' %}" class="btn btn-secondary">
                    <i class="bi bi-x-circle me-1"></i> Cancelar
                </a>
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash3 me-1"></i> Eliminar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
